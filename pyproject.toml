[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "json-pretty-diff"
version = "1.2.0"
description = "HTML-only diff generator for top-level JSON objects"
authors = [{ name = "Javier Lianes García" }]
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = []
keywords = ["json", "diff", "html", "cli", "report"]

[project.urls]
Homepage = "https://github.com/JaviLianes8/json-pretty-diff"
Documentation = "https://github.com/JaviLianes8/json-pretty-diff/blob/main/GUIDE.md"
Source = "https://github.com/JaviLianes8/json-pretty-diff"
Issues = "https://github.com/JaviLianes8/json-pretty-diff/issues"
Changelog = "https://github.com/JaviLianes8/json-pretty-diff/blob/main/CHANGELOG.md"
LinkedIn = "https://www.linkedin.com/in/jlianes/"
Funding = "https://buymeacoffee.com/jlianesglrs"

[project.scripts]
jpd = "json_pretty_diff.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["json_pretty_diff*"]

[tool.setuptools.package-data]
json_pretty_diff = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["tests/upstream", "tests/golden"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
# The stylesheet and some messages are long string literals; the layout is kept as written.
ignore = ["E501", "RUF001", "UP006", "UP007", "UP035", "UP045"]

[tool.mypy]
# mypy cannot target 3.9; the suite runs on 3.9 and the code uses postponed annotations.
python_version = "3.10"
strict = true
files = ["src", "tests", "scripts", "main.py"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
pythonpath = ["src", "tests"]
addopts = "--doctest-modules"
doctest_optionflags = ["ELLIPSIS"]
